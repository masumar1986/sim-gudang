<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E40AF">
  <title>SIM Gudang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=2.1.0">
</head>
<body class="logged-out">
  <div id="netBar" aria-hidden="true"></div>

  <!-- Loading awal -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat...</span></div>
    <p class="mt-3 text-2">Memuat aplikasi...</p>
    <noscript><p class="px-4 text-center" style="color:#991B1B">JavaScript dinonaktifkan di browser ini. Aktifkan JavaScript untuk memakai SIM Gudang.</p></noscript>
  </div>

  <!-- Sidebar (tampil setelah login) -->
  <nav id="sidebar" class="sidebar" aria-label="Menu utama">
    <div class="sb-brand">
      <div class="sb-logo" id="sbLogo"><i class="bi bi-box-seam"></i></div>
      <div><b id="appTitle">SIM Gudang</b><small id="appSub">Depot Operasional</small></div>
    </div>
    <div class="sb-user"><b id="sbUserName">-</b><span id="sbUserRole">-</span></div>
    <ul class="sb-nav" id="sidebar-nav"></ul>
    <div class="sb-foot">
      <div id="verTag" style="font-size:11px;opacity:.7;padding:0 12px 6px"></div>
      <button type="button" onclick="toggleDarkMode()"><i class="bi bi-moon-stars"></i> <span id="themeLabel">Mode Gelap</span></button>
      <button type="button" onclick="handleLogout()"><i class="bi bi-box-arrow-left"></i> Keluar</button>
    </div>
  </nav>
  <div id="sbOverlay" class="sb-overlay" onclick="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn d-lg-none" onclick="toggleSidebar()" aria-label="Buka menu"><i class="bi bi-list fs-5"></i></button>
      <h1 id="pageTitle">Dashboard</h1>
      <span class="chip ok hide-sm" title="Terhubung ke Google Sheets">Sinkron</span>
      <button type="button" class="icon-btn" onclick="refreshPage()" aria-label="Muat ulang data" title="Muat ulang data"><i class="bi bi-arrow-clockwise"></i></button>
      <button type="button" class="icon-btn" onclick="toggleDarkMode()" aria-label="Ganti tema"><i class="bi bi-moon-stars"></i></button>
    </header>

    <!-- KONTAINER SPA: seluruh halaman disuntikkan di sini -->
    <main id="app-container" class="page"></main>
  </div>

  <!-- Navigasi bawah (HP) -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi cepat"></nav>

  <!-- Modal serbaguna -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable" id="appModalDialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="appModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="appModalBody"></div>
        <div class="modal-footer" id="appModalFooter"></div>
      </div>
    </div>
  </div>

  <!-- Modal pratinjau berkas -->
  <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="previewTitle">Pratinjau</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body text-center" id="previewBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn-x btn-ghost" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Tutup</button>
          <a id="previewDownload" class="btn-x btn-primary-x" download><i class="bi bi-download"></i> Unduh</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <!-- Pustaka pihak ketiga (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>

  <!-- Kode aplikasi (urutan penting; jalur relatif agar jalan di subfolder GitHub Pages) -->
  <script src="js/config.js?v=2.1.0" onerror="(window.__loadErrors=window.__loadErrors||[]).push('js/config.js')"></script>
  <script src="js/api.js?v=2.1.0" onerror="(window.__loadErrors=window.__loadErrors||[]).push('js/api.js')"></script>
  <script src="js/core.js?v=2.1.0" onerror="(window.__loadErrors=window.__loadErrors||[]).push('js/core.js')"></script>
  <script src="js/pages-1.js?v=2.1.0" onerror="(window.__loadErrors=window.__loadErrors||[]).push('js/pages-1.js')"></script>
  <script src="js/pages-2.js?v=2.1.0" onerror="(window.__loadErrors=window.__loadErrors||[]).push('js/pages-2.js')"></script>
  <script src="js/barcode.js?v=2.1.0" onerror="(window.__loadErrors=window.__loadErrors||[]).push('js/barcode.js')"></script>
</body>
</html>
